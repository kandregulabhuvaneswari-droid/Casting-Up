<!DOCTYPE html>
<html>
<head>
<title>Apply - CASTINGUP</title>
<link rel="stylesheet" href="/static/styles.css">
</head>

<body>

<!-- HEADER -->
<header>
  <nav class="navbar">

    <div class="logo">
      🎬 CASTINGUP
    </div>

    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/audition">Auditions</a></li>
      <li><a href="/apply">Apply</a></li>
      <li><a href="/login">Admin</a></li>
    </ul>

  </nav>
</header>

<main>

<h1>📝 Application Form</h1>

<section>

{% if errors %}
<div class="error">
  <strong>Please fix the following errors:</strong>
  <ul>
    {% for error in errors %}
      <li>{{ error }}</li>
    {% endfor %}
  </ul>
</div>
{% endif %}

<form method="POST" action="/apply">

<label for="full_name">Full Name: <span style="color: red;">*</span></label>
<input type="text" id="full_name" name="full_name" value="{{ form.full_name }}" required><br>

<label for="age">Age: <span style="color: red;">*</span></label>
<input type="number" id="age" name="age" value="{{ form.age }}" required><br>

<label for="email">Email: <span style="color: red;">*</span></label>
<input type="email" id="email" name="email" value="{{ form.email }}" required><br>

<label for="phone">Phone Number: <span style="color: red;">*</span></label>
<input type="tel" id="phone" name="phone" value="{{ form.phone }}" required><br>

<label for="experience">Experience/Skills:</label>
<textarea id="experience" name="experience" rows="4" placeholder="Tell us about your acting experience or skills...">{{ form.experience }}</textarea><br>

<input type="submit" value="Submit Application">

</form>

<p style="margin-top: 2rem; text-align: center;">
  <a href="/" style="color: #667eea; text-decoration: none;">← Back to Home</a>
</p>

</section>

</main>

<footer>
  <p>&copy; 2026 CASTINGUP. All rights reserved.</p>
</footer>

</body>
</html>
